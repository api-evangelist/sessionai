note: >-
  Session AI publishes no self-serve sandbox, no test credentials, and no magic test
  values. What it does document is a namespace-level separation between production and
  sandbox, provisioned by a human. Nothing below is invented; no test key, token, or
  identifier is published by the provider to record.
separation:
