- name: Session AI MCP Server
  description: 'Remote Model Context Protocol server operated by Session AI at
    https://sessionai.com/mcp. The endpoint answers with an RFC 9728 OAuth challenge
    (WWW-Authenticate: Bearer realm="mcp") and publishes protected-resource metadata
    naming Session AI as the resource; tools/list requires an authenticated bearer token,
    so the live tool schemas could not be enumerated anonymously.'
  humanURL: https://sessionai.com/capabilities/agentic-ai
