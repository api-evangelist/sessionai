name: Session AI
description: 'Session AI is an ecommerce AI platform that uses agentic decisioning to optimize
  promotions and customer experiences in real time. Its Session Marketing Agent predicts
  in-session visitor intent and behavior, then delivers personalized offers, nudges, and
  messages to maximize revenue, conversions, and profit margins for retail, travel and
  hospitality, and telecom brands. The platform integrates via tag managers (Google Tag
  Manager, Tealium), an SDK, server-to-server calls, and prebuilt plugins/cartridges,
  advertising sub-50ms decision latency, no PII collection, and SOC 2 aligned controls.
  It was surfaced as a portfolio company of Norwest Venture Partners; no public developer
  portal, API reference, or OpenAPI is currently published (integration is arranged during
  onboarding).'
