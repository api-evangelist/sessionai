apis:
- name: Session AI Platform REST API
  description: 'Public REST API for the Session AI (ZineOne) platform. Documented operations
    cover sending events into the platform from any channel, retrieving hosted content,
    calling customer-authored microservices, running stream and cube queries, CCPA profile
    opt-in and opt-out, and retrieving customer profile details and activity. Requests
    are authenticated with an apikey header (or a server-generated accesstoken header);
    the profile and activity endpoints require a valid Session AI portal login.'
  humanURL: https://devguide.zineone.com/docs/rest-api-reference
  baseURL: https://cloud.zineone.com/c3
  tags:
