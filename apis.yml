name: Session AI
description: 'Session AI (formerly ZineOne) is an ecommerce AI platform that uses agentic
  decisioning to optimize promotions and customer experiences in real time. Its Session
  Marketing Agent predicts in-session visitor intent and behavior, then delivers personalized
  offers, nudges, and messages to maximize revenue, conversions, and profit margins for
  retail, travel and hospitality, and telecom brands. The platform integrates via tag
  managers (Google Tag Manager, Tealium), a CDN-delivered HTML5/JavaScript SDK, Android
  and iOS SDKs, server-to-server REST calls, and prebuilt plugins/cartridges, advertising
  sub-50ms decision latency, no PII in scope, and SOC 2 aligned controls. Session AI
  publishes a public developer guide and REST API reference under its legacy ZineOne
  domain covering nine documented operations — send events, retrieve content, call
  microservices, stream and cube queries, CCPA profile opt-in/opt-out, and profile and
  activity retrieval — authenticated with an apikey header. It also operates an
  OAuth-protected remote MCP server at https://sessionai.com/mcp for agent access.'
