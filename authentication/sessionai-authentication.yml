    tokenUrl: https://jsaqyxhgmkgcyaocjnzz.supabase.co/auth/v1/oauth/token
    registrationUrl: https://jsaqyxhgmkgcyaocjnzz.supabase.co/auth/v1/oauth/clients/register
    scopes:
